name: Build NXAnime 0.7.5 NRO

on:
  push:
    branches:
      - nxanime-build-075
    paths:
      - '.github/workflows/build-nxanime-075.yml'
      - 'nxanime_chunks/**'
      - 'nxanime_fixes/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch source
        shell: bash
        run: |
          set -euxo pipefail
          cat nxanime_chunks/part{00..11}.txt nxanime_chunks/part12a.txt nxanime_chunks/part12b.txt | tr -d '\r\n' > /tmp/nxanime.b64
          test "$(wc -c < /tmp/nxanime.b64)" -eq 128960
          echo "fcaa7c06a3170f7df0efc6449b4cde1e797d9da4dfdf9354d3b98b6088229cb9  /tmp/nxanime.b64" | sha256sum -c -
          base64 -d /tmp/nxanime.b64 > /tmp/nxanime.tar.gz
          gzip -t /tmp/nxanime.tar.gz
          rm -rf build-src
          mkdir -p build-src
          tar -xzf /tmp/nxanime.tar.gz -C build-src
          patch -p1 -d build-src < nxanime_fixes/repair-v3.patch
          sed -i 's/;launcher_force_builtin_direct(st);/;/' build-src/nxanime_source/main.cpp
          touch build-src/Makefile build-src/icon.jpg build-src/nxanime_source/*
          grep -n "NROFLAGS" build-src/Makefile
          grep -n "curl_io_open_cb\|likely_hls\|SOCKS5 当前" build-src/nxanime_source/player.cpp
          grep -n "launcher_cycle_proxy\|X 仅用于编辑自定义" build-src/nxanime_source/main.cpp
          if grep -q "launcher_force_builtin_direct" build-src/nxanime_source/main.cpp; then exit 1; fi

      - name: Verify bundled Switch dependencies
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/devkitpro/switchvars.sh
          aarch64-none-elf-pkg-config --exists freetype2 libcurl libpng libwebp sdl2 libavformat libavcodec libavutil libswscale libswresample
          aarch64-none-elf-pkg-config --modversion libavformat

      - name: Build NRO
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/devkitpro/switchvars.sh
          cd build-src
          sed -i 's/pkg-config --cflags/aarch64-none-elf-pkg-config --cflags/g; s/pkg-config --libs/aarch64-none-elf-pkg-config --libs/g' Makefile
          aarch64-none-elf-pkg-config --cflags freetype2 libcurl libpng libwebp sdl2 libavformat libavcodec libavutil libswscale libswresample
          make clean || true
          make -j2
          test -s NXAnime.nro
          file NXAnime.nro || true
          ls -lh NXAnime.nro
          sha256sum NXAnime.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXAnime-0.7.5-repair-v3
          path: build-src/NXAnime.nro
          if-no-files-found: error
          retention-days: 7
