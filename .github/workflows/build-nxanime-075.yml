name: Build NXAnime 0.7.5 NRO

on:
  push:
    branches:
      - nxanime-build-075
    paths:
      - '.github/workflows/build-nxanime-075.yml'
      - 'nxanime_chunks/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source bundle from chunks
        shell: bash
        run: |
          set -euxo pipefail
          cat nxanime_chunks/part{00..11}.txt nxanime_chunks/part12a.txt nxanime_chunks/part12b.txt | tr -d '\r\n' > /tmp/nxanime.b64
          test "$(wc -c < /tmp/nxanime.b64)" -eq 128960
          echo "fcaa7c06a3170f7df0efc6449b4cde1e797d9da4dfdf9354d3b98b6088229cb9  /tmp/nxanime.b64" | sha256sum -c -
          base64 -d /tmp/nxanime.b64 > /tmp/nxanime.tar.gz
          gzip -t /tmp/nxanime.tar.gz
          mkdir -p build-src
          tar -xzf /tmp/nxanime.tar.gz -C build-src
          find build-src -maxdepth 2 -type f -print

      - name: Build NRO
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/devkitpro/switchvars.sh
          cd build-src
          make clean || true
          make -j2
          test -s NXAnime.nro
          file NXAnime.nro || true
          ls -lh NXAnime.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXAnime-0.7.5-hotfix-nro
          path: build-src/NXAnime.nro
          if-no-files-found: error
          retention-days: 7
