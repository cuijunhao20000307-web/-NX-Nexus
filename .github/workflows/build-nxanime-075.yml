name: Build NXAnime 0.7.5 NRO

on:
  push:
    branches:
      - nxanime-build-075
    paths:
      - '.github/workflows/build-nxanime-075.yml'
      - 'nxanime_chunks/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source bundle from chunks
        shell: bash
        run: |
          set -euxo pipefail
          cat nxanime_chunks/part{00..11}.txt nxanime_chunks/part12a.txt nxanime_chunks/part12b.txt | tr -d '\r\n' > /tmp/nxanime.b64
          test "$(wc -c < /tmp/nxanime.b64)" -eq 128960
          echo "fcaa7c06a3170f7df0efc6449b4cde1e797d9da4dfdf9354d3b98b6088229cb9  /tmp/nxanime.b64" | sha256sum -c -
          base64 -d /tmp/nxanime.b64 > /tmp/nxanime.tar.gz
          gzip -t /tmp/nxanime.tar.gz
          mkdir -p build-src
          tar -xzf /tmp/nxanime.tar.gz -C build-src
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-src/nxanime_source/player.cpp')
          s = p.read_text()

          if 'const bool online_video_smooth' not in s:
              needle = '    const std::string media_url = sanitize_media_url(source.url);'
              insert = '''    // RRTV/online-video streams use the larger timestamp-aware buffer.\n    // Girigiri/anime keeps its established lower-latency demux behavior.\n    const bool online_video_smooth =\n        request.referer.find("yichengwlkj.com") != std::string::npos ||\n        request.referer.find("rrmj.plus") != std::string::npos;\n'''
              if needle not in s:
                  raise SystemExit('media_url insertion point not found')
              s = s.replace(needle, insert + needle, 1)

          # A few providers return URLs containing literal spaces after JSON/AES
          # decoding. FFmpeg's Switch HTTP protocol rejects those with EINVAL.
          sanitize_needle = '    replace_all("&amp;", "&");\n    return url;'
          sanitize_repl = '''    replace_all("&amp;", "&");\n    replace_all("\\\\u003d", "=");\n    replace_all("\\\\u003f", "?");\n    replace_all("\\\\u002f", "/");\n    replace_all(" ", "%20");\n    return url;'''
          if sanitize_needle in s:
              s = s.replace(sanitize_needle, sanitize_repl, 1)

          old = '''    // Compatibility fallback: retry once with only the universally supported\n    // HTTP options. This specifically avoids the "Invalid argument" regression\n    // seen when a port's protocol option table differs from desktop FFmpeg.\n    if (rc < 0) {\n        if (fmt) avformat_close_input(&fmt);\n        fmt = make_format_context();\n        if (fmt) {\n            opts = make_open_options(true);\n            io_deadline_ns.store(now_ns() + 30'000'000'000ULL, std::memory_order_relaxed);\n            int retry_rc = avformat_open_input(&fmt, media_url.c_str(), nullptr, &opts);\n            io_deadline_ns.store(0, std::memory_order_relaxed);\n            av_dict_free(&opts);\n            rc = retry_rc;\n        }\n    }\n'''
          new = '''    // Compatibility fallback #1: retry with the reduced option set.\n    // Some Switch FFmpeg builds reject desktop-only protocol options with EINVAL.\n    if (rc < 0) {\n        if (fmt) avformat_close_input(&fmt);\n        fmt = make_format_context();\n        if (fmt) {\n            opts = make_open_options(true);\n            io_deadline_ns.store(now_ns() + 30'000'000'000ULL, std::memory_order_relaxed);\n            int retry_rc = avformat_open_input(&fmt, media_url.c_str(), nullptr, &opts);\n            io_deadline_ns.store(0, std::memory_order_relaxed);\n            av_dict_free(&opts);\n            rc = retry_rc;\n        }\n    }\n\n    // Compatibility fallback #2: let FFmpeg allocate its own AVFormatContext and\n    // pass absolutely no dictionary options. This avoids EINVAL caused either by\n    // a preconfigured context field or by a protocol option unsupported in the\n    // devkitPro Switch FFmpeg port. After a successful open we restore the runtime\n    // interrupt/probe settings used by NXAnime.\n    if (rc < 0) {\n        if (fmt) avformat_close_input(&fmt);\n        fmt = nullptr;\n        io_deadline_ns.store(0, std::memory_order_relaxed);\n        int bare_rc = avformat_open_input(&fmt, media_url.c_str(), nullptr, nullptr);\n        rc = bare_rc;\n        if (rc >= 0 && fmt) {\n            fmt->interrupt_callback.callback = io_interrupt_cb;\n            fmt->interrupt_callback.opaque = &io_interrupt;\n            fmt->probesize = 256 * 1024;\n            fmt->max_analyze_duration = 500000;\n            fmt->flags |= AVFMT_FLAG_FAST_SEEK;\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('FFmpeg compatibility fallback block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          touch build-src/Makefile build-src/icon.jpg build-src/nxanime_source/*
          find build-src -maxdepth 2 -type f -print

      - name: Install Switch dependencies
        shell: bash
        run: |
          set -euxo pipefail
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --needed --noconfirm \
            switch-freetype \
            switch-curl \
            switch-libpng \
            switch-libwebp \
            switch-sdl2 \
            switch-ffmpeg \
            switch-libjpeg-turbo

      - name: Build NRO
        shell: bash
        run: |
          set -euxo pipefail
          source /opt/devkitpro/switchvars.sh
          cd build-src
          sed -i 's/pkg-config --cflags/aarch64-none-elf-pkg-config --cflags/g; s/pkg-config --libs/aarch64-none-elf-pkg-config --libs/g' Makefile
          aarch64-none-elf-pkg-config --cflags freetype2 libcurl libpng libwebp sdl2 libavformat libavcodec libavutil libswscale libswresample
          make clean || true
          make -j2
          test -s NXAnime.nro
          file NXAnime.nro || true
          ls -lh NXAnime.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: NXAnime-0.7.5-hotfix-nro
          path: build-src/NXAnime.nro
          if-no-files-found: error
          retention-days: 7
